name: Build PROJECT ZERO Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'PROJECT-ZERO-build-0.2.2.zip'
      - '.github/workflows/PROJECT-ZERO-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract project
        run: unzip -q PROJECT-ZERO-build-0.2.2.zip
      - name: Install and build web app
        working-directory: project-zero
        run: |
          npm install
          npm run build
      - name: Add Android platform
        working-directory: project-zero
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: project-zero/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-ZERO-APK-DEBUG
          path: project-zero/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
