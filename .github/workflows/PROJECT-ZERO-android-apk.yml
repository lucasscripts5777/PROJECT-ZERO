name: Gerar APK do PROJECT ZERO
on:
  workflow_dispatch:
  push:
    paths:
      - 'PROJECT-ZERO-build-0.1.0.zip'
      - '.github/workflows/project-zero-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extrair projeto
        run: unzip -q PROJECT-ZERO-build-0.1.0.zip
      - name: Instalar dependências e compilar versão web
        working-directory: project-zero
        run: |
          npm install
          npm run build
      - name: Preparar plataforma Android
        working-directory: project-zero
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK de teste
        working-directory: project-zero/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-ZERO-APK-DEBUG
          path: project-zero/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
